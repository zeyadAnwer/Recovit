# nginx config used by CI to run Lighthouse against production-like serving
# (same static layout, gzip and proxying as recovik.conf, without TLS).
# Started by .github/workflows/ci.yml with: nginx -c $PWD/deploy/nginx/ci.conf -p $PWD
worker_processes 1;
error_log /tmp/nginx-ci-error.log;
pid /tmp/nginx-ci.pid;
events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-ci-body;
    proxy_temp_path /tmp/nginx-ci-proxy;

    server {
        listen 127.0.0.1:4500;
        root dist/client;
        index index.html;
        absolute_redirect off;
        gzip_static on;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml text/plain application/xml;

        location ~ ^/(en/)?(_actions/|start-a-case/sent/|contact/sent/) {
            proxy_pass http://127.0.0.1:4321;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
