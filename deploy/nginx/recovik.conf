# nginx site for Recovik. `__DOMAIN__` is replaced by deploy/server-setup.sh.
# Static pages are served from disk; only form endpoints reach Node.

limit_req_zone $binary_remote_addr zone=recovik_forms:10m rate=10r/m;

upstream recovik_node {
    server 127.0.0.1:4321;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:RecovikSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/recovik/current/dist/client;
    index index.html;
    server_tokens off;
    charset utf-8;
    client_max_body_size 64k;
    absolute_redirect off;

    # Pre-compressed .gz files are written at build time (src/integrations/precompress.ts).
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;

    # Fingerprinted build assets: cache forever.
    location /_astro/ {
        include /etc/nginx/snippets/recovik-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The only dynamic surface: Astro Actions and the no-JS receipt pages.
    # Node adds the security headers itself (src/middleware.ts).
    location ~ ^/(en/)?(_actions/|start-a-case/sent/|contact/sent/) {
        limit_req zone=recovik_forms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://recovik_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    location /en/ {
        include /etc/nginx/snippets/recovik-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
        error_page 404 /en/404/index.html;
    }

    location / {
        include /etc/nginx/snippets/recovik-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
